# Production blueprint. Keep live checkout disabled until the payment launch
# checklist and a controlled real transaction have passed.
services:
  - type: web
    name: homeplant-production
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - docs/**
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: App__DeploymentStage
        value: Production
      - key: App__PublicBaseUrl
        value: https://homeplant-production.onrender.com
      - key: Subscriptions__Enabled
        value: "true"
      - key: Subscriptions__EnforceLimits
        value: "true"
      - key: Payments__Mode
        value: Disabled
      - key: Payments__DemoEnabled
        value: "false"
      - key: Payments__NewCheckoutsEnabled
        value: "false"
      # Only enable behind Render's edge proxy, not on a directly exposed server.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ASPNETCORE_HTTPS_PORT
        value: "443"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-key.json
      - key: Firebase__ProjectId
        sync: false
      - key: Firebase__ApiKey
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: Gemini__Model
        value: gemini-3.5-flash-lite
      - key: Gemini__FallbackModels
        value: gemini-3.1-flash-lite,gemini-3.5-flash
